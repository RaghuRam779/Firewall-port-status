version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: fpc-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - fpc-network

  server:
    build:
      context: ./server
    container_name: fpc-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/firewall-checker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
      SCAN_TARGET_ALLOWLIST: ${SCAN_TARGET_ALLOWLIST:-}
      MAX_SCAN_DURATION_MS: 180000
      NMAP_PATH: nmap
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      SCAN_RATE_LIMIT_MAX: 10
    # Nmap SYN scans and OS detection need raw sockets. NET_RAW/NET_ADMIN are granted
    # narrowly instead of running the container privileged.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - fpc-network

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: fpc-client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - fpc-network

  nginx:
    image: nginx:1.27-alpine
    container_name: fpc-nginx
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fpc-network

volumes:
  mongo-data:

networks:
  fpc-network:
    driver: bridge
